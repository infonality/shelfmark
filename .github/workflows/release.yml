name: Release

# Cut a release by pushing a version tag, e.g.:
#   git tag v0.1.0 && git push origin v0.1.0
# CI then builds native installers on each OS and attaches them to a DRAFT
# GitHub Release for you to review and publish.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allow manual runs from the Actions tab

jobs:
  release:
    permissions:
      contents: write # needed to create the GitHub Release
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal binary (Apple Silicon + Intel) -> .dmg / .app
          - platform: macos-latest
            args: "--target universal-apple-darwin"
            rust_targets: "aarch64-apple-darwin,x86_64-apple-darwin"
            pdfium_asset: "pdfium-mac-univ.tgz"
            pdfium_member: "lib/libpdfium.dylib"
            pdfium_dest: "src-tauri/libpdfium.dylib"
          # Linux -> .deb (Mint/Ubuntu), .rpm (Fedora), .AppImage (portable)
          - platform: ubuntu-22.04
            args: ""
            rust_targets: ""
            pdfium_asset: "pdfium-linux-x64.tgz"
            pdfium_member: "lib/libpdfium.so"
            pdfium_dest: "src-tauri/libpdfium.so"
          # Windows -> .msi + NSIS .exe installer
          - platform: windows-latest
            args: ""
            rust_targets: ""
            pdfium_asset: "pdfium-win-x64.tgz"
            pdfium_member: "bin/pdfium.dll"
            pdfium_dest: "src-tauri/pdfium.dll"

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf \
            libfuse2 \
            file

      # PDFium renders PDF pages and first-page covers. Fetch the platform's
      # prebuilt library so it gets bundled as an app resource.
      #
      # Retried, and failing loudly. Without `--retry` a single hiccup on one
      # platform loses the whole release — which it has done, twice in one
      # afternoon. Without `--fail` an error page is written to the archive
      # instead, and the build dies further along at `tar` complaining about a
      # corrupt file, which says nothing about what went wrong.
      - name: Fetch PDFium
        shell: bash
        run: |
          curl --location --silent --show-error --fail \
            --retry 5 --retry-all-errors --retry-delay 5 \
            -o pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/${{ matrix.pdfium_asset }}"
          tar -xzf pdfium.tgz "${{ matrix.pdfium_member }}"
          cp "${{ matrix.pdfium_member }}" "${{ matrix.pdfium_dest }}"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Only tag pushes create a release. A manual run leaves this empty so
          # tauri-action just builds, and the installers come out as workflow
          # artifacts below — test builds shouldn't land on the releases page.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Shelfmark ${{ github.ref_name }}"
          releaseBody: "Download the installer for your platform below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Manual runs: grab the installers from the run's Artifacts section.
      # They expire after 14 days, which is right for a throwaway test build.
      - name: Upload installers as artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: shelfmark-${{ matrix.platform }}
          # Globbed rather than read from the action's outputs: the universal
          # macOS build nests under its own target directory, and a glob copes
          # with that without depending on the output format.
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*-setup.exe
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
          retention-days: 14
          if-no-files-found: error
