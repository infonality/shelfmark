name: Verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  epub-reader:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install EPUB render-test browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Test EPUB compatibility layer
        run: npm run test:epub

      - name: Build frontend
        run: npm run build
