<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:epub="http://www.idpf.org/2007/ops" xml:lang="en">
<head><title>Self-closing elements</title></head>
<body>
  <span role="doc-pagebreak" aria-label="1"/>
  <a id="empty-anchor"/>
  <h1 id="after-marker">Visible chapter</h1>
  <p>This prose must remain outside the empty page-break marker and visible.</p>
  <table><tbody><tr><td/><td>Second cell remains separate.</td></tr></tbody></table>
  <img src="art.svg" alt="Void elements remain void"/>
</body>
</html>
