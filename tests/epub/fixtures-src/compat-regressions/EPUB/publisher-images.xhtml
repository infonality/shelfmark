<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">
<head>
  <title>Publisher image sizing</title>
  <style>
    .imprint { width: 2em; height: 3em; }
    .float { float: right; width: 35%; }
    .wide { column-span: all; }
  </style>
</head>
<body id="figures">
  <p>Publisher-selected dimensions must survive compatibility preparation.</p>
  <img class="imprint" src="art.svg" alt="Small imprint"/>
  <figure class="float"><img src="art.svg" alt="Floating figure"/><figcaption>Caption</figcaption></figure>
  <a class="wide" href="linked-toc.xhtml#target"><img src="art.svg" alt="Linked illustration"/></a>
</body>
</html>
